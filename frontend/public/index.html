<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login / Signup UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 350px;
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .form-wrapper {
      display: flex;
      transition: transform 0.4s ease-in-out;
      width: 200%;
    }

    form {
      width: 100%;
      padding: 0 1rem;
      transition: all 0.3s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 1rem;
      border: none;
      background-color: #667eea;
      color: white;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #5a67d8;
    }

    .toggle {
      text-align: center;
      margin-top: 1rem;
      cursor: pointer;
      color: #667eea;
      font-size: 0.9rem;
    }

    .signup-mode .form-wrapper {
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="container" id="container">
    <div class="form-wrapper" id="formWrapper">
      <!-- Login Form -->
      <form id="loginForm">
        <h2>Login</h2>
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <p class="toggle" onclick="toggleMode()">Don't have an account? Sign up</p>
      </form>

      <!-- Signup Form -->
      <form id="signupForm">
        <h2>Sign Up</h2>
        <input type="text" placeholder="Username" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <p class="toggle" onclick="toggleMode()">Already have an account? Login</p>
      </form>
    </div>
  </div>

  <script>
    function toggleMode() {
      const container = document.getElementById('container');
      container.classList.toggle('signup-mode');
    }
  </script>

</body>
</html>
